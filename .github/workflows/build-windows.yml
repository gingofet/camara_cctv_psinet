name: Build Windows agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build standalone package
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: CCTVFlow-Windows-x64
          path: dist/CCTVFlow-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
