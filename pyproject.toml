[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cctvflow"
version = "0.5.0"
description = "Automatización asistida de mantenimiento CCTV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.61.0",
    "pypdf==6.10.0",
    "PySide6==6.11.1",
    "python-dotenv==1.2.2",
]

[project.scripts]
cctvflow = "cctvflow.__main__:main"

[tool.setuptools.packages.find]
include = ["cctvflow*"]

[tool.setuptools.package-data]
cctvflow = [
    "resources/catalogs/*.json",
    "ui/assets/*.svg",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
